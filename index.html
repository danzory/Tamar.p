<!DOCTYPE html>

<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0C0C0E">
<title>תמר ס׳ | Coached by Dan Z</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800;900&family=Frank+Ruhl+Libre:wght@700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body,#root{height:100%;background:#0C0C0E}
  body{font-family:'Heebo',sans-serif;direction:rtl;color:#F0EBE1;-webkit-tap-highlight-color:transparent}
  ::-webkit-scrollbar{display:none}
  input{outline:none}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;
const { AreaChart, Area, BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, ReferenceLine, Cell } = Recharts;

const GOLD=”#C9A84C”,GOLD_DIM=”#7A5E1A”,BG=”#0C0C0E”,CARD=”#161618”,CARD2=”#1F1F23”,
TEXT=”#F0EBE1”,MUTED=”#4A4A50”,MUTED2=”#888”,GREEN=”#4A9A50”,BLUE=”#4A7BAA”,
ORANGE=”#C06640”,RED=”#A84040”;
const TARGET_CAL=1750,CUR_W=66.3,GOAL_W=62.0,START_W=69.2,RATE=0.28;

const weightData=[
{date:“1/3”,w:69.2,trend:69.2},{date:“8/3”,w:68.8,trend:69.0},
{date:“15/3”,w:68.5,trend:68.8},{date:“22/3”,w:68.9,trend:68.7},
{date:“29/3”,w:68.1,trend:68.5},{date:“5/4”,w:67.8,trend:68.2},
{date:“12/4”,w:67.4,trend:67.9},{date:“19/4”,w:67.6,trend:67.7},
{date:“26/4”,w:67.0,trend:67.4},{date:“3/5”,w:66.6,trend:67.1},
{date:“7/5”,w:66.3,trend:66.8},
];
const weeklyLog=[
{day:“א’”,cal:1520,ok:true},{day:“ב’”,cal:1390,ok:true},{day:“ג’”,cal:0,ok:false},
{day:“ד’”,cal:1680,ok:true},{day:“ה’”,cal:1450,ok:true},{day:“ו’”,cal:1510,ok:true},
{day:“ש’”,cal:1320,ok:true},
];
const MEALS=[
{id:1,name:“ארוחת בוקר”,items:[“2 ביצים”,“לחם מלא ×2”,“גבינה לבנה 5%”],cal:380,p:28,c:34,f:14},
{id:2,name:“צהריים”,items:[“חזה עוף 150g”,“אורז מלא 80g”,“ירקות מאודים”],cal:520,p:42,c:58,f:8},
{id:3,name:“ביניים”,items:[“קוטג׳ 5%”,“בננה”],cal:220,p:18,c:30,f:5},
];
const INIT_EX=[
{id:1,name:“לחיצת חזה”,sets:4,reps:10,tw:45,pr:“52 ק״ג”},
{id:2,name:“חתירה בטה”,sets:4,reps:10,tw:40,pr:“48 ק״ג”},
{id:3,name:“לחיצת כתפיים”,sets:3,reps:10,tw:22.5,pr:“27.5 ק״ג”},
{id:4,name:“תלייה מורחבת”,sets:3,reps:8,tw:0,pr:null,bw:true},
{id:5,name:“כפיפות מרפק”,sets:3,reps:12,tw:12,pr:“15 ק״ג”},
];
const PRS=[
{name:“סקוואט”,val:80,prev:75,date:“15/4”,unit:“ק״ג”,medal:“🥇”},
{name:“לחיצת חזה”,val:52,prev:47.5,date:“22/4”,unit:“ק״ג”,medal:“🥈”},
{name:“דדליפט”,val:90,prev:85,date:“28/4”,unit:“ק״ג”,medal:“🥉”},
{name:“לחיצת כתפיים”,val:27.5,prev:25,date:“5/5”,unit:“ק״ג”,medal:“🏅”},
{name:“תלייה”,val:10,prev:8,date:“2/5”,unit:“חז’”,medal:“🏅”},
];

const loggedDays=weeklyLog.filter(d=>d.ok);
const avgCal=Math.round(loggedDays.reduce((a,d)=>a+d.cal,0)/loggedDays.length);
const dailyDef=Math.round((RATE*7700)/7);
const TDEE=avgCal+dailyDef;
const adh=Math.round((loggedDays.length/7)*100);
const weeksLeft=Math.ceil((CUR_W-GOAL_W)/RATE);
const progPct=Math.round(((START_W-CUR_W)/(START_W-GOAL_W))*100);
const totCal=MEALS.reduce((a,m)=>a+m.cal,0);
const totP=MEALS.reduce((a,m)=>a+m.p,0);
const totC=MEALS.reduce((a,m)=>a+m.c,0);
const totF=MEALS.reduce((a,m)=>a+m.f,0);

const todayStr=()=>{
const days=[“ראשון”,“שני”,“שלישי”,“רביעי”,“חמישי”,“שישי”,“שבת”];
const months=[“ינואר”,“פברואר”,“מרץ”,“אפריל”,“מאי”,“יוני”,“יולי”,“אוגוסט”,“ספטמבר”,“אוקטובר”,“נובמבר”,“דצמבר”];
const d=new Date();
return `יום ${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]}`;
};

// ── UI Atoms ──
function Card({children,style={},onClick}){
return <div onClick={onClick} style={{background:CARD,borderRadius:18,padding:16,border:“1px solid #1E1E22”,cursor:onClick?“pointer”:“default”,…style}}>{children}</div>;
}
function STitle({children}){
return <div style={{fontSize:10,fontWeight:800,letterSpacing:3,color:MUTED2,textTransform:“uppercase”,marginBottom:12}}>{children}</div>;
}
function BarUI({value,max,color,h=7}){
const p=Math.min(100,Math.round((value/max)*100));
return <div style={{background:”#252528”,borderRadius:99,height:h,overflow:“hidden”}}>
<div style={{width:`${p}%`,height:“100%”,background:color,borderRadius:99,transition:“width 0.7s”}}/>

  </div>;
}
function Ring({p,color,size=104,stroke=10,children}){
  const r=(size-stroke)/2, circ=2*Math.PI*r, dash=(Math.min(100,p)/100)*circ;
  return <div style={{position:"relative",width:size,height:size,flexShrink:0}}>
    <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#252528" strokeWidth={stroke}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke}
        strokeDasharray={`${dash} ${circ-dash}`} strokeLinecap="round"
        style={{transition:"stroke-dasharray 0.7s"}}/>
    </svg>
    <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>{children}</div>
  </div>;
}
function EnergyBar({intake,tdee}){
  const diff=intake-tdee, isDef=diff<0;
  const barPct=Math.min(48,(Math.abs(diff)/tdee)*100*3);
  return <div>
    <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:MUTED2,marginBottom:8}}>
      <span>עודף</span>
      <span style={{fontWeight:700,color:TEXT,fontSize:12}}>{isDef?"גירעון":"עודף"}: <span style={{color:isDef?GREEN:ORANGE}}>{Math.abs(diff)} קק״ל</span></span>
      <span>גירעון</span>
    </div>
    <div style={{position:"relative",height:12,background:"#1E1E22",borderRadius:99}}>
      <div style={{position:"absolute",left:"50%",top:0,bottom:0,width:2,background:"#333",transform:"translateX(-50%)"}}/>
      <div style={{position:"absolute",top:2,bottom:2,borderRadius:99,background:isDef?GREEN:ORANGE,width:`${barPct}%`,right:isDef?"50%":undefined,left:isDef?undefined:"50%"}}/>
    </div>
    <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:MUTED,marginTop:5}}>
      <span>↑ +500</span><span>TDEE: {tdee} קק״ל</span><span>↓ -500</span>
    </div>
  </div>;
}
function GoalETA(){
  return <Card style={{background:"linear-gradient(135deg,#111A0E,#0C120A)",borderColor:"#1E3018"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
      <div>
        <div style={{fontSize:10,color:GREEN,fontWeight:700,letterSpacing:1,marginBottom:3}}>ETA ליעד</div>
        <div style={{fontSize:28,fontWeight:900}}>{weeksLeft} <span style={{fontSize:14,fontWeight:400,color:MUTED2}}>שבועות</span></div>
        <div style={{fontSize:11,color:MUTED2,marginTop:2}}>{CUR_W} → {GOAL_W} ק״ג</div>
      </div>
      <Ring p={progPct} color={GREEN} size={72} stroke={7}>
        <div style={{fontSize:13,fontWeight:900,color:GREEN}}>{progPct}%</div>
      </Ring>
    </div>
    <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:MUTED2,marginBottom:6}}>
      <span>התחלה {START_W}</span><span style={{color:GOLD}}>● {CUR_W} ק״ג</span><span>יעד {GOAL_W}</span>
    </div>
    <div style={{position:"relative",background:"#1E2A1E",borderRadius:99,height:8}}>
      <div style={{width:`${progPct}%`,height:"100%",background:`linear-gradient(90deg,${GREEN}88,${GREEN})`,borderRadius:99,position:"relative"}}>
        <div style={{position:"absolute",left:"100%",top:"50%",transform:"translate(-50%,-50%)",width:14,height:14,background:GOLD,borderRadius:"50%",border:"2px solid #0C120A",boxShadow:`0 0 8px ${GOLD}88`}}/>
      </div>
    </div>
    <div style={{fontSize:11,color:MUTED2,marginTop:8}}>קצב: <span style={{color:GREEN,fontWeight:700}}>-{RATE} ק״ג/שבוע</span> · על פי EWMA</div>
  </Card>;
}

// ── DASHBOARD ──
function Dashboard({setTab}){
const hour=new Date().getHours();
const gr=hour<12?“בוקר טוב”:hour<17?“צהריים טובים”:“ערב טוב”;
const diff=totCal-TDEE;
return <div style={{padding:“22px 16px 0”,display:“flex”,flexDirection:“column”,gap:16}}>
<div>
<div style={{fontSize:12,color:MUTED2,marginBottom:3}}>{todayStr()}</div>
<div style={{fontSize:30,fontFamily:”‘Frank Ruhl Libre’,serif”,fontWeight:900,lineHeight:1.15}}>{gr},<br/><span style={{color:GOLD}}>תמר</span> ✨</div>
</div>
<Card style={{background:“linear-gradient(135deg,#1A1A0E,#141409)”,borderColor:”#2A2A10”}}>
<div style={{display:“flex”,gap:12,alignItems:“flex-start”}}>
<div style={{width:40,height:40,borderRadius:“50%”,flexShrink:0,background:`linear-gradient(135deg,${GOLD},${GOLD_DIM})`,display:“flex”,alignItems:“center”,justifyContent:“center”,fontWeight:800,fontSize:16,color:”#000”}}>ד</div>
<div>
<div style={{fontSize:10,color:GOLD,fontWeight:700,letterSpacing:1,marginBottom:5}}>דן מ׳ · עכשיו</div>
<div style={{fontSize:13.5,lineHeight:1.65}}>תמר 🌟 על פי ה-EWMA את בקצב של -{RATE} ק״ג/שבוע. עוד {weeksLeft} שבועות ליעד! יאללה 💪</div>
</div>
</div>
</Card>
<div style={{display:“grid”,gridTemplateColumns:“1fr 1fr 1fr”,gap:10}}>
{[{l:“אימונים”,v:“3/4”,s:“השבוע”,c:GOLD},{l:“רצף”,v:“12”,s:“ימים 🔥”,c:”#E07030”},{l:“מעקב”,v:`${adh}%`,s:“השבוע”,c:BLUE}].map(s=>
<Card key={s.l} style={{padding:“14px 10px”,textAlign:“center”}}>
<div style={{fontSize:22,fontWeight:900,color:s.c}}>{s.v}</div>
<div style={{fontSize:11,color:MUTED2,marginTop:2}}>{s.l}</div>
<div style={{fontSize:10,color:MUTED,marginTop:1}}>{s.s}</div>
</Card>
)}
</div>
<Card style={{background:”#111114”,borderColor:”#222226”}}>
<div style={{display:“flex”,justifyContent:“space-between”,alignItems:“center”,marginBottom:14}}>
<div>
<div style={{fontSize:10,color:MUTED2,fontWeight:700,letterSpacing:1,marginBottom:3}}>TDEE · הוצאה יומית</div>
<div style={{fontSize:24,fontWeight:900}}>{TDEE} <span style={{fontSize:13,color:MUTED2,fontWeight:400}}>קק״ל</span></div>
</div>
<div style={{textAlign:“center”,background:”#1A1A1E”,padding:“8px 14px”,borderRadius:12}}>
<div style={{fontSize:11,color:MUTED2,marginBottom:2}}>ממוצע שבועי</div>
<div style={{fontSize:18,fontWeight:800,color:GOLD}}>{avgCal}</div>
<div style={{fontSize:10,color:MUTED2}}>קק״ל/יום</div>
</div>
</div>
<EnergyBar intake={totCal} tdee={TDEE}/>
</Card>
<GoalETA/>
<Card onClick={()=>setTab(“workout”)} style={{background:“linear-gradient(135deg,#1C1808,#111008)”,borderColor:”#2A2408”}}>
<div style={{display:“flex”,justifyContent:“space-between”,alignItems:“center”}}>
<div>
<div style={{fontSize:10,color:GOLD,fontWeight:700,letterSpacing:1,marginBottom:5}}>אימון היום</div>
<div style={{fontSize:19,fontWeight:800}}>כוח עילי A 💪</div>
<div style={{fontSize:12,color:MUTED2,marginTop:4}}>5 תרגילים · ~55 דק׳</div>
</div>
<div style={{background:GOLD,color:”#000”,borderRadius:12,padding:“10px 18px”,fontWeight:900,fontSize:14,border:“none”}}>← פתח</div>
</div>
</Card>
<div>
<STitle>תזונה היום</STitle>
<Card>
<div style={{display:“flex”,gap:16,alignItems:“center”}}>
<Ring p={Math.min(100,Math.round((totCal/TARGET_CAL)*100))} color={GOLD} size={100} stroke={9}>
<div style={{textAlign:“center”}}>
<div style={{fontSize:19,fontWeight:900,color:GOLD}}>{totCal}</div>
<div style={{fontSize:9,color:MUTED2}}>/ {TARGET_CAL}</div>
<div style={{fontSize:9,color:GREEN,fontWeight:600,marginTop:1}}>{TARGET_CAL-totCal} נותרו</div>
</div>
</Ring>
<div style={{flex:1,display:“flex”,flexDirection:“column”,gap:10}}>
{[{l:“חלבון”,c:totP,t:130,col:GREEN},{l:“פחמימות”,c:totC,t:175,col:BLUE},{l:“שומן”,c:totF,t:58,col:ORANGE}].map(m=>
<div key={m.l}>
<div style={{display:“flex”,justifyContent:“space-between”,fontSize:11,marginBottom:4}}>
<span style={{color:MUTED2}}>{m.l}</span>
<span style={{fontWeight:700}}>{m.c}<span style={{color:MUTED,fontWeight:400}}>/{m.t}g</span></span>
</div>
<BarUI value={m.c} max={m.t} color={m.col} h={6}/>
</div>
)}
</div>
</div>
</Card>
</div>

  </div>;
}

// ── WORKOUT ──
function Workout(){
const [exs,setExs]=useState(INIT_EX.map(e=>({…e,logged:[]})));
const [sel,setSel]=useState(null);
const [iReps,setIReps]=useState(””); const [iWeight,setIWeight]=useState(””);
const [timerSec,setTimerSec]=useState(null); const [timerTotal,setTimerTotal]=useState(90);
const intRef=useRef(null);
const startTimer=secs=>{
clearInterval(intRef.current); setTimerTotal(secs); setTimerSec(secs);
intRef.current=setInterval(()=>setTimerSec(p=>{if(p<=1){clearInterval(intRef.current);return null;}return p-1;}),1000);
};
useEffect(()=>()=>clearInterval(intRef.current),[]);
const logSet=ex=>{
const reps=parseInt(iReps)||ex.reps, weight=iWeight!==’’?parseFloat(iWeight):ex.tw;
setExs(prev=>prev.map(e=>e.id===ex.id?{…e,logged:[…e.logged,{reps,weight}]}:e));
setIReps(””); setIWeight(””); startTimer(90);
};
const done=exs.filter(e=>e.logged.length>=e.sets).length;
return <div style={{padding:“22px 16px 0”}}>
<div style={{marginBottom:18}}>
<div style={{fontSize:10,color:GOLD,fontWeight:700,letterSpacing:1,marginBottom:4}}>אימון היום</div>
<div style={{fontSize:26,fontFamily:”‘Frank Ruhl Libre’,serif”,fontWeight:900}}>כוח עילי A</div>
<div style={{fontSize:12,color:MUTED2,marginTop:4}}>{done}/{exs.length} תרגילים</div>
<div style={{marginTop:10}}><BarUI value={done} max={exs.length} color={GOLD} h={5}/></div>
</div>
{timerSec!==null&&<Card style={{background:”#1A1408”,borderColor:”#2E2510”,marginBottom:16,padding:“12px 16px”}}>
<div style={{display:“flex”,justifyContent:“space-between”,alignItems:“center”}}>
<div style={{fontSize:12,color:MUTED2}}>⏱ מנוחה</div>
<div style={{fontSize:30,fontWeight:900,color:GOLD,fontVariantNumeric:“tabular-nums”}}>
{String(Math.floor(timerSec/60)).padStart(2,“0”)}:{String(timerSec%60).padStart(2,“0”)}
</div>
<button onClick={()=>{clearInterval(intRef.current);setTimerSec(null);}} style={{background:”#2A2A2E”,border:“none”,color:TEXT,borderRadius:8,padding:“6px 12px”,cursor:“pointer”,fontFamily:”‘Heebo’,sans-serif”,fontSize:12}}>דלג</button>
</div>
<div style={{marginTop:8}}><BarUI value={timerTotal-timerSec} max={timerTotal} color={GOLD} h={4}/></div>
</Card>}
<div style={{display:“flex”,flexDirection:“column”,gap:12}}>
{exs.map(ex=>{
const isDone=ex.logged.length>=ex.sets, isOpen=sel===ex.id;
return <Card key={ex.id} onClick={()=>!isDone&&setSel(isOpen?null:ex.id)}
style={{borderColor:isDone?”#2A442A”:isOpen?”#2A2614”:”#1E1E22”,background:isDone?”#101A10”:isOpen?”#1A1A0E”:CARD}}>
<div style={{display:“flex”,alignItems:“center”,gap:10}}>
<div style={{width:28,height:28,borderRadius:“50%”,flexShrink:0,background:isDone?GREEN:”#252528”,display:“flex”,alignItems:“center”,justifyContent:“center”,fontSize:12,fontWeight:700,color:isDone?”#fff”:MUTED2}}>
{isDone?“✓”:ex.logged.length}
</div>
<div style={{flex:1}}>
<div style={{display:“flex”,alignItems:“center”,gap:8,flexWrap:“wrap”}}>
<span style={{fontSize:15,fontWeight:700}}>{ex.name}</span>
{ex.pr&&<span style={{fontSize:9,background:”#2A1A06”,color:GOLD,padding:“2px 7px”,borderRadius:99,fontWeight:700}}>שיא {ex.pr}</span>}
</div>
<div style={{fontSize:12,color:MUTED2,marginTop:3}}>{ex.sets} × {ex.reps} חז’{!ex.bw&&` · יעד: ${ex.tw} ק״ג`}</div>
</div>
{!isDone&&<div style={{fontSize:16,color:isOpen?GOLD:MUTED,transform:isOpen?“rotate(180deg)”:“none”,transition:“transform 0.2s”}}>⌄</div>}
</div>
<div style={{display:“flex”,gap:6,marginTop:10,marginRight:38}}>
{Array.from({length:ex.sets}).map((_,i)=>
<div key={i} style={{width:36,height:36,borderRadius:10,background:i<ex.logged.length?GREEN:”#252528”,display:“flex”,flexDirection:“column”,alignItems:“center”,justifyContent:“center”,fontSize:10,fontWeight:700,color:i<ex.logged.length?”#fff”:MUTED,transition:“background 0.3s”}}>
{i<ex.logged.length?<><span>{ex.logged[i].reps}</span>{!ex.bw&&<span style={{fontSize:8,fontWeight:400,color:”#9fd09f”}}>{ex.logged[i].weight}k</span>}</>:<span style={{fontSize:11}}>{i+1}</span>}
</div>
)}
</div>
{isOpen&&!isDone&&<div style={{marginTop:14,paddingTop:14,borderTop:“1px solid #2A2A2E”,display:“flex”,gap:10,alignItems:“flex-end”}} onClick={e=>e.stopPropagation()}>
<div style={{flex:1}}>
<div style={{fontSize:10,color:MUTED2,marginBottom:5}}>חזרות</div>
<input type=“number” value={iReps} placeholder={ex.reps} onChange={e=>setIReps(e.target.value)} style={{width:“100%”,background:”#252528”,border:“1px solid #333”,borderRadius:10,padding:10,color:TEXT,fontSize:18,fontFamily:”‘Heebo’,sans-serif”,textAlign:“center”}}/>
</div>
{!ex.bw&&<div style={{flex:1}}>
<div style={{fontSize:10,color:MUTED2,marginBottom:5}}>ק״ג</div>
<input type=“number” value={iWeight} placeholder={ex.tw} onChange={e=>setIWeight(e.target.value)} style={{width:“100%”,background:”#252528”,border:“1px solid #333”,borderRadius:10,padding:10,color:TEXT,fontSize:18,fontFamily:”‘Heebo’,sans-serif”,textAlign:“center”}}/>
</div>}
<button onClick={()=>logSet(ex)} style={{background:GOLD,color:”#000”,border:“none”,borderRadius:12,padding:“12px 18px”,fontWeight:900,fontSize:14,cursor:“pointer”,fontFamily:”‘Heebo’,sans-serif”,flexShrink:0}}>סט {ex.logged.length+1} ✓</button>
</div>}
</Card>;
})}
</div>
{done===exs.length&&<Card style={{marginTop:20,background:“linear-gradient(135deg,#162016,#0E160E)”,borderColor:”#2A442A”,textAlign:“center”,padding:“28px 20px”}}>
<div style={{fontSize:44,marginBottom:10}}>🎉</div>
